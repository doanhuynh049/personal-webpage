<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal portfolio">
  <title>Personal Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app">
    <div class="page-loading">
      <div class="page-loading-spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-prev" aria-label="Previous photo">&lsaquo;</button>
    <button class="lightbox-next" aria-label="Next photo">&rsaquo;</button>
    <figure class="lightbox-content">
      <img src="" alt="">
      <figcaption></figcaption>
    </figure>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
