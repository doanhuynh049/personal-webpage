<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Personal Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Login -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="login-brand">
        <div class="login-icon">✦</div>
        <h1>Admin Panel</h1>
        <p>Sign in to manage your personal page</p>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      <p class="login-error" id="login-error" hidden></p>
      <a href="/" class="login-back">← View public site</a>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">✦</span>
        <span>Page Admin</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-panel="profile">Profile</button>
        <button class="nav-item" data-panel="about">About</button>
        <button class="nav-item" data-panel="education">Education</button>
        <button class="nav-item" data-panel="jobs">Work</button>
        <button class="nav-item" data-panel="experience">Experience</button>
        <button class="nav-item" data-panel="gallery">Gallery</button>
        <button class="nav-item" data-panel="contact">Contact</button>
      </nav>
      <div class="sidebar-footer">
        <a href="/" target="_blank" class="sidebar-link">View Site ↗</a>
        <button id="logout-btn" class="sidebar-link sidebar-link--muted">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h2 id="panel-title">Profile</h2>
        <div class="topbar-actions">
          <span class="save-status" id="save-status"></span>
        </div>
      </header>

      <div class="panel-area">
        <!-- Profile -->
        <section class="panel active" id="panel-profile">
          <div class="card-form">
            <div class="form-row">
              <div class="form-group">
                <label>Name</label>
                <input type="text" id="profile-name">
              </div>
              <div class="form-group">
                <label>Greeting</label>
                <input type="text" id="profile-greeting">
              </div>
            </div>
            <div class="form-group">
              <label>Tagline</label>
              <input type="text" id="profile-tagline" placeholder="Student · Developer · Photographer">
            </div>
            <div class="form-group">
              <label>Introduction</label>
              <textarea id="profile-intro" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Profile Photo</label>
              <div class="image-upload">
                <img id="profile-preview" class="image-preview" src="" alt="Profile preview">
                <div class="image-upload-actions">
                  <label class="btn btn-secondary btn-sm">
                    Upload Photo
                    <input type="file" id="profile-upload" accept="image/*" hidden>
                  </label>
                  <span class="hint">JPG, PNG, WebP up to 10 MB</span>
                </div>
              </div>
            </div>
            <button class="btn btn-primary" id="save-profile">Save Profile</button>
          </div>
        </section>

        <!-- About -->
        <section class="panel" id="panel-about">
          <div class="card-form">
            <div class="form-group">
              <label>Section Heading</label>
              <input type="text" id="about-heading">
            </div>
            <div class="form-group">
              <label>Bio</label>
              <textarea id="about-bio" rows="4"></textarea>
            </div>
            <div class="form-row form-row--3">
              <div class="form-group">
                <label>Location</label>
                <input type="text" id="about-location">
              </div>
              <div class="form-group">
                <label>Focus</label>
                <input type="text" id="about-focus">
              </div>
              <div class="form-group">
                <label>Currently</label>
                <input type="text" id="about-currently">
              </div>
            </div>
            <button class="btn btn-primary" id="save-about">Save About</button>
          </div>
        </section>

        <!-- Education -->
        <section class="panel" id="panel-education">
          <div class="panel-toolbar">
            <button class="btn btn-secondary btn-sm" id="add-education">+ Add Education</button>
          </div>
          <div id="education-list" class="item-list"></div>
        </section>

        <!-- Jobs -->
        <section class="panel" id="panel-jobs">
          <div class="panel-toolbar">
            <button class="btn btn-secondary btn-sm" id="add-job">+ Add Job</button>
          </div>
          <div id="jobs-list" class="item-list"></div>
        </section>

        <!-- Experience -->
        <section class="panel" id="panel-experience">
          <div class="panel-toolbar">
            <button class="btn btn-secondary btn-sm" id="add-experience">+ Add Experience</button>
          </div>
          <div id="experience-list" class="item-list"></div>
        </section>

        <!-- Gallery -->
        <section class="panel" id="panel-gallery">
          <div class="panel-toolbar">
            <label class="btn btn-secondary btn-sm">
              + Upload Photo
              <input type="file" id="gallery-upload" accept="image/*" hidden>
            </label>
          </div>
          <div id="gallery-list" class="gallery-admin-grid"></div>
        </section>

        <!-- Contact -->
        <section class="panel" id="panel-contact">
          <div class="panel-toolbar">
            <button class="btn btn-secondary btn-sm" id="add-contact">+ Add Contact</button>
          </div>
          <div id="contact-list" class="item-list"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
