services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: personal
      POSTGRES_PASSWORD: personal
      POSTGRES_DB: personal_web
    volumes:
      - personal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal -d personal_web"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  personal_pgdata:
